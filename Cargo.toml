[package]
name = "herdr-portal"
version = "0.5.0"
edition = "2021"
license = "MIT"
description = "Forward remote Herdr workspace ports to this laptop, with a JSON API for agents"

[dependencies]
anyhow = "1"
crossterm = "0.29"
unicode-width = "0.2"
libc = "0.2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
